@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1316;--pn:#171e23;--tx:#e6ecee;--mu:#8fa0aa;--ln:#28343b;--ac:#ff8a4c;--hl:#2a1d16;--hd:#0a0e10}.btn.p,.xp,.n.ok{color:#1a0e08}}

.brand{display:none}
@media (min-width:900px){body{padding-left:240px}#app{max-width:880px}.nav{top:0;bottom:auto;right:auto;width:240px;height:100vh;flex-direction:column;justify-content:flex-start;padding:20px 14px;border-top:0;border-right:1px solid var(--ln)}.nav button{max-width:none;flex:none;text-align:left;padding:12px 14px;margin-bottom:4px;font-size:14px}.brand{display:block;font-weight:800;font-size:18px;padding:4px 14px 18px}.brand small{display:block;font-weight:400;color:var(--mu);font-size:12px}.hero{padding:24px}}

.nd:focus-visible{outline:3px solid var(--tx);outline-offset:3px}.nd.done{background:var(--live);border-color:var(--live);color:#fff;font-weight:700}.nd.lk{border-color:var(--ln);opacity:.55;cursor:default;box-shadow:none}.nd.cur{animation:pl 1.4s ease-in-out infinite}

.chb{background:var(--hd);color:#fff;border-radius:12px;padding:12px 14px;margin:18px 0 6px;font-weight:700}
.bx{border-left:4px solid var(--live);padding:8px 10px;margin:10px 0;border-radius:6px;background:color-mix(in srgb,var(--live) 12%,var(--pn))}.bx.un{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--pn))}

.chb{background:var(--c,var(--ac));border-radius:16px;box-shadow:0 5px 0 #0004;font-size:16px}.nd{width:76px;height:76px;font-size:32px;border-color:var(--c,var(--ac));box-shadow:0 6px 0 #0003,0 0 18px color-mix(in srgb,var(--c,var(--ac)) 55%,transparent)}.nd.lk{box-shadow:none}.road::before{border-left-color:var(--c,var(--ln));opacity:.5}
.lad{background:#0f0a2a;border-radius:14px;padding:10px;color:#e8e4ff}.lad .rung{border-color:#6d5fc7}.lad .el i{color:#b9b0ee}.lad .el b{color:#e8e4ff}.lad .el.on{border-color:#34d399;filter:drop-shadow(0 0 4px #34d399aa)}.lad .el.on b{color:#34d399}.lad .el{border-bottom-color:#6d5fc7}.lad .slot{background:#2a2070}.lad .slot.e{border-color:#a78bfa}.lad .tonb{border-color:#6d5fc7;color:#e8e4ff}.lad .tonb.on{border-color:#34d399}
.sv{width:100%;height:auto;margin-bottom:8px;background:#0f0a2a;border-radius:14px}.sv text{font:600 9px system-ui;fill:#e8e4ff;text-anchor:middle}.sv rect{fill:#2a2070;stroke:#a78bfa;stroke-width:2}.sv .fl{stroke:#a78bfa;stroke-width:3;stroke-dasharray:4 3;animation:dsh 1s linear infinite}.sv .pk{fill:#facc15;transform:translateY(60px)}.fb{animation-name:hl;animation-iteration-count:infinite}
@keyframes hl{0%,60%,100%{opacity:.4}10%,35%{opacity:1}}@keyframes dsh{to{stroke-dashoffset:-14}}
.rush{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:linear-gradient(120deg,#f59e0b,#ef4444);color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:18px;box-shadow:0 6px 0 #0004;margin-bottom:12px}.rush small{display:block;font-weight:400;font-size:13px}.rush:focus-visible,.mis:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mis{all:unset;box-sizing:border-box;cursor:pointer;background:var(--c);color:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 0 #0004;display:flex;flex-direction:column;gap:4px}.mis span{font-size:30px}.mis small{opacity:.9}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

<script>
const $=id=>document.getElementById(id);
const sg=s=>{const[n,f]=s.split(':');return{n,i:f[0]=='i',o:f=='o',mom:f.includes('m'),nc:f.includes('n')}};
const sc=(lo,hi,ol,oh,iu,ou)=>({w:{lo,hi,ol,oh,iu,ou},gen(){const f=[.25,.5,.75][Math.random()*3|0],x=+(lo+(hi-lo)*f).toFixed(1);return{q:'Input = '+x+' '+iu+'. What is the output in '+ou+'?',a:ol+(oh-ol)*f,e:'NORM_X: ('+x+' − '+lo+') ÷ ('+hi+' − '+lo+') = '+f+'. SCALE_X: '+f+' × ('+oh+' − '+ol+') + '+ol+' = '+(ol+(oh-ol)*f)+' '+ou+'.'}}});
const sealT=[{d:'Press Start',set:{Start:1},n:2,x:{Motor:1}},{d:'Release Start (seal-in must hold)',set:{Start:0},n:3,x:{Motor:1}},{d:'Press Stop',set:{Stop:1},n:2,x:{Motor:0}},{d:'Release Stop (must stay off)',set:{Stop:0},n:3,x:{Motor:0}}];
const sealR=[{e:[{or:[[{s:0}],[{s:1}]]},{s:2}],o:[{coil:'Run'}]},{e:[{s:3}],o:[{coil:'Motor'}]}];
const C=[
{k:'l',t:'NO contact and coil',g:'Turn the Lamp on while Switch is ON. Tap the empty slot and pick a contact.',tags:['Switch:is','Lamp:o'],rungs:[{e:[{s:0}],o:[{coil:'Lamp'}]}],h:'A normally open contact passes power when its tag is TRUE.',sol:{0:{c:'Switch'}},w:'Use an NO contact on Switch. When Switch (%I0.0) is TRUE the contact closes, power reaches the coil and Lamp (%Q0.0) turns on.',qz:{q:'Which contact lets power through when its tag is TRUE?',o:['NO contact','NC contact'],a:0,w:'NO (normally open) closes when the tag is TRUE. NC does the opposite.'},tests:[{d:'Switch OFF',set:{},n:2,x:{Lamp:0}},{d:'Switch ON',set:{Switch:1},n:2,x:{Lamp:1}}]},
{k:'l',t:'NC contact and field wiring',g:'Motor runs only if Run_Sw is ON and the guard is closed. Guard_OK is wired normally closed, so its tag is TRUE while the guard is closed. Fault lamp lights when the guard opens.',tags:['Run_Sw:is','Guard_OK:isn','Motor:o','Fault:o'],rungs:[{e:[{s:0},{s:1}],o:[{coil:'Motor'}]},{e:[{s:2}],o:[{coil:'Fault'}]}],h:'Fault needs the opposite of Guard_OK. That is an NC contact on the tag.',sol:{0:{c:'Run_Sw'},1:{c:'Guard_OK'},2:{c:'Guard_OK',nc:1}},w:'Guard_OK is TRUE while the guard is closed, so Motor needs a NO contact on it. Fault must light when the guard opens (tag FALSE), so it needs an NC contact on the same tag.',qz:{q:'A stop button is wired normally closed. When pressed, what does its tag read?',o:['TRUE','FALSE'],a:1,w:'Pressing opens the NC wiring, so the input loses signal and reads FALSE. That is why the program uses a NO contact for it.'},tests:[{d:'Run on, guard closed',set:{Run_Sw:1},n:2,x:{Motor:1,Fault:0}},{d:'Guard opened',set:{Guard_OK:1},n:2,x:{Motor:0,Fault:1}},{d:'Everything back to normal, Run off',set:{Guard_OK:0,Run_Sw:0},n:2,x:{Motor:0,Fault:0}}]},
{k:'l',t:'Seal-in (latching) circuit',g:'Start and Stop push buttons. Motor stays on after Start is released. Run is an internal memory bit that latches the request, and Motor follows it. Stop is wired normally closed (tag TRUE until pressed).',tags:['Start:im','Stop:imn','Run:x','Motor:o'],rungs:sealR,h:'Network 1 latches the memory bit Run: Start in parallel with a Run contact, Stop in series. Network 2 copies Run to the Motor output.',sol:{0:{c:'Start'},1:{c:'Run'},2:{c:'Stop'},3:{c:'Run'}},w:'Run is latched by Start OR Run, in series with Stop. Once Run is TRUE its own contact keeps it on after Start is released. Stop (NC-wired, TRUE when healthy) takes a plain NO contact. The Motor output simply follows Run. Using an internal bit for the latch keeps the output tag for output duty only.',qz:{q:'Which tag holds the latch in this program?',o:['Start','The Run memory bit','The Stop contact'],a:1,w:'Run feeds back around Start, so the rung stays true until Stop breaks it. The Motor output only copies Run.'},tests:sealT},
{k:'l',t:'TON timer block',g:'Pre-start horn: Horn sounds while Run is true and the 3 s timer has not finished. Seal-in and the timer are already built.',tags:['Start:im','Stop:imn','Run:x','T1_Q:x','Motor:o','Horn:o'],rungs:[{e:[{or:[[{c:'Start'}],[{c:'Run'}]]},{c:'Stop'}],o:[{coil:'Run'}]},{e:[{c:'Run'}],o:[{ton:'T1',pt:3000,q:'T1_Q'}]},{e:[{c:'T1_Q'}],o:[{coil:'Motor'}]},{e:[{s:0},{s:1}],o:[{coil:'Horn'}]}],h:'Horn = Run (NO) AND T1_Q (NC). Watch ET count up in the timer block.',sol:{0:{c:'Run'},1:{c:'T1_Q',nc:1}},w:'Horn must sound while the system is running (Run, NO) but before the timer finishes (T1_Q is FALSE, so an NC contact). After 3 s T1_Q turns TRUE and the horn stops while Motor starts.',qz:{q:'What does a TON timer do when its input goes FALSE?',o:['Keeps counting','ET resets to zero','Q stays ON'],a:1,w:'A TON (on-delay) resets ET and Q the moment IN goes FALSE.'},tests:[{d:'Press Start',set:{Start:1},n:2,x:{Horn:1,Motor:0}},{d:'Release Start, 1 s into the delay',set:{Start:0},n:8,x:{Horn:1,Motor:0}},{d:'After 3 s',set:{},n:30,x:{Horn:0,Motor:1}},{d:'Press Stop',set:{Stop:1},n:2,x:{Horn:0,Motor:0}}]},
{k:'l',t:'Fault finding: motor will not start',g:'Commissioning call: pressing Start does nothing. The program was copied from another machine. Find the wrong contact and fix it.',tags:['Start:im','Stop:imn','Run:x','Motor:o'],rungs:sealR,p:{0:{c:'Start'},1:{c:'Run'},2:{c:'Stop',nc:1},3:{c:'Run'}},h:'Stop is wired NC, so its tag is TRUE when healthy. An NC contact on it blocks power all the time.',sol:{0:{c:'Start'},1:{c:'Run'},2:{c:'Stop'},3:{c:'Run'}},w:'The Stop contact was NC. Because Stop is already wired NC in the field, its tag is TRUE when healthy, and an NC contact inverts that to FALSE, so the rung never gets power. Change it to a NO contact.',qz:{q:'Start does nothing and the Stop tag is TRUE. Where do you look first?',o:['The motor','The contact type used for Stop','The PLC power supply'],a:1,w:'A healthy NC-wired Stop reads TRUE. Check whether the program uses NO or NC for it before touching hardware.'},tests:sealT},

const CH=[
{id:'c1',t:'Meet the PLC',ic:'🧠',L:[
['What is a PLC?','A PLC is a tough little computer built for factories. It watches switches and sensors, thinks using the program you write, then turns motors, lamps and valves ON or OFF. Think of it as the brain of the machine.','Controlling machines that run for years: kilns, conveyors, pumps, fans.','Office work or storing huge amounts of data. Use a SCADA system or a server for that.'],
['The parts you can touch','<b>Power supply:</b> turns plant power (like 230 V AC) into the 24 V DC the PLC uses.<br><b>CPU:</b> the brain. It stores and runs your program.<br><b>Input modules:</b> the ears. They read buttons, switches and sensors.<br><b>Output modules:</b> the hands. They switch lamps, relays and contactors ON or OFF.<br><b>Rail or rack:</b> the metal bar that holds the modules side by side.','Add more input or output modules when you run out of connection points.','Never connect a big motor straight to an output. The output drives a small relay or contactor, and that switches the motor.'],
['The scan: how the PLC thinks','The PLC repeats a loop again and again: 1) read all inputs, 2) run your program from top to bottom, 3) update all outputs. One loop is one scan and takes a few milliseconds. The PLC only sees the world at the moment it reads the inputs.','Remember the order: a rung lower down can use what a rung above just decided.','Do not expect it to catch a signal shorter than one scan. Very fast pulses need special fast inputs.'],
['Addresses: where each signal lives','<b>I</b> means input, <b>Q</b> means output, <b>M</b> means memory (an internal notebook bit). %I0.0 reads: input, byte 0, bit 0. In your GE PLC the same idea looked like %I00001. In Siemens you also give every signal a name (a tag) like Start_Button, so you read names, not numbers.','Always name your tags clearly.','Do not use one address for two jobs.'],
['Wiring in plain words','A button wired to an input: when pressed, power reaches the input terminal and the PLC sees ON. Stop buttons and safety switches are usually wired the opposite way: they read ON when everything is healthy and drop OFF when pressed or when the wire breaks. A broken wire then stops the machine instead of silently disabling the stop.','Wire stops, guards and trips so that OFF means danger.','Do not wire a stop so that ON means stop. A broken wire would hide the problem.']]},
{id:'c2',t:'How devices talk',ic:'📡',L:[
['Why networks exist','The old way: one wire from every sensor to the cabinet. The modern way: one cable carries many signals and devices share it. That saves wire, time and mistakes.','Long distances and many devices.','A single sensor right next to the PLC. A plain wire is simpler.'],
['PROFINET: the Siemens favourite','PROFINET runs on industrial Ethernet cable. It connects the PLC to remote I/O racks (like ET 200), drives and HMI panels. It is fast and predictable. Every device gets a unique name and IP address.','Fast control between the PLC, remote I/O, drives and HMIs.','Do not mix it with the office network. Keep plant and office networks separate.'],
['PROFIBUS: the older cousin','PROFIBUS uses a two-wire cable and is still in many older plants. One PLC talks to drives, instruments and I/O along one line. Each device has an address number.','Connecting older drives and instruments that already speak it.','New projects usually choose PROFINET instead.'],
['Modbus and OPC UA','Modbus (serial or over Ethernet) is simple and common on other brands: energy meters, gas analysers, drives. OPC UA passes data upward to SCADA, reports or the cloud.','Modbus: reading meters and analysers. OPC UA: sharing data with SCADA and IT systems.','Do not use OPC UA for fast machine control or safety. Never give two devices the same IP address.'],
['Good habits for connections','Give each device a unique name and IP address. Label cables. Keep a drawing of who talks to whom. Load the hardware settings and the program together. When a device drops off the network the PLC raises a fault, so read the diagnostics before changing anything.','Always write down names and IPs.','Never plug a random laptop into the control network.']]},
{id:'c3',t:'ON and OFF logic',ic:'💡',p:'c3',L:[
['Contacts ask a question','A contact is a question: is this signal ON? If yes, power passes to the right. In this app you choose between "passes when ON" (the normal contact) and "passes when OFF" (the inverted contact).','Passes when ON: for things that must be ON (start request, door closed). Passes when OFF: for things that must be OFF (no fault, no alarm).','Do not pick by guessing. First decide what the signal means in real life.'],
['Coils are the answer','A coil turns an output ON when power reaches it and OFF when power stops. Conditions in a row are AND: all must pass. Conditions side by side are OR: any one passes.','AND for permissions. OR for alternative ways to start.','Do not drive the same output from two coils in different places. The last one wins and confuses you.'],
['The golden rule of stops and faults','Stops and faults must fail safe. A stop button reads ON while healthy, so you use "passes when ON" for it. A fault alarm reads ON when there is a problem, so you use "passes when OFF" for it.','Safety and trip signals: design so that OFF means danger.','Do not rely on the program alone. A real emergency stop also cuts power in hardware.']]},
{id:'c4',t:'Memory and hold-in',ic:'🔒',p:'c4',L:[
['Why buttons need memory','A start button is pressed for a moment, but the machine must keep running. The program needs a memory bit that remembers "running". This is a hold-in, or latch.','Any start and stop with push buttons.','Do not use the output itself as the memory. Use an internal memory bit and let the output follow it.'],
['The hold-in pattern','Network 1: (Start OR Run) AND Stop-healthy turns Run ON. Once Run is ON, its own path keeps it ON after Start is let go. Pressing Stop breaks the path. Network 2: the machine follows Run. Put faults in series with Stop so any fault drops the latch.','Latches that must restart only after a deliberate new press.','Do not put Start in series with Stop. Stop must always win.'],
['Interlocks: never both','A machine that runs both ways must never get both commands. Both contactors closing together shorts the power lines and causes a flashover. Each direction needs the other command in series as "passes when OFF".','Forward and reverse, open and close, up and down.','Do not trust the operator never to press both. Make the program refuse.']]},
{id:'c5',t:'Timers',ic:'⏱',p:'c5',L:[
['Three timers','<b>ON-delay timer (TON):</b> waits before switching ON. <b>OFF-delay timer (TOF):</b> keeps the output ON for a while after the input goes OFF. <b>Pulse timer (TP):</b> gives one fixed-length pulse.','TON: a warning horn before a conveyor starts. TOF: a cooling fan that keeps running after the burner stops. TP: a short pulse to open a valve.','Do not use a timer to guess what a sensor can tell you. If you wait 30 seconds for "pressure OK", use the pressure sensor.'],
['Presets and time units','The preset time (PT) is written T#10s for 10 seconds or T#2m for 2 minutes. While counting, the timer shows elapsed time (ET). In Siemens each timer needs its own memory (an instance data block) that TIA Portal creates for you.','Show the elapsed time on the HMI so operators know what is left.','Do not use one timer for two jobs.']]},
{id:'c6',t:'Counters',ic:'🔢',p:'c6',L:[
['Counters count events','A counter adds one each time a pulse arrives, for example a sensor seeing a loaded skip pass. When the count reaches the target, its Done signal turns ON. A reset sends it back to zero.','Counting loads, bottles, bags, starts.','Do not count very fast pulses (a spinning shaft) with a normal counter. Use a high-speed counter input. Never forget the reset.']]},
{id:'c7',t:'Blocks: OB, FC, FB, DB',ic:'🧱',L:[
['The blocks of a Siemens program','<b>OB (organisation block):</b> the main loop the PLC calls every scan. OB1 is your main program. <b>FC (function):</b> reusable logic with no memory, like a calculator. <b>FB (function block):</b> reusable logic with its own memory. <b>DB (data block):</b> a notebook of values. An FB keeps its memory in an instance DB, one for each use.','OB1: where everything starts. DB: values you want to keep or show on the HMI.','Do not put the whole plant in one giant OB1. Split it into blocks.'],
['FC or FB: how to choose','Ask: does it need to remember something between scans (a timer, a latch, a count)? Yes means FB. No means FC. A scaling calculation is an FC: the same input always gives the same output. A motor controller with start, stop, fault and timers is an FB: each motor needs its own memory.','FC: scaling, unit conversion, simple checks. FB: motors, valves, pumps, anything with state.','Do not use an FC when you need a timer or latch inside it. Do not share one instance DB between two motors. They would overwrite each other.'],
['Why blocks save you','Without blocks you copy the same motor logic 20 times, and fixing one bug means fixing 20 places. With one FB you fix it once and call it 20 times, each call with its own instance DB.','Anything you repeat more than twice.','A tiny one-off rung that nothing else uses.']]},
{id:'c8',t:'Numbers and scaling',ic:'📈',p:'c8',L:[
['What analog signals are','Some sensors do not say ON or OFF. They give a number: temperature, pressure, level. The common signal is 4 to 20 mA. The input card turns it into a raw number from 0 to 27648. You convert that to real units yourself.','Any measurement that varies.','Do not show the raw number to operators.'],
['Live zero and scaling','4 mA means 0 % and 20 mA means 100 %. The 4 mA start is the live zero: a broken wire reads 0 mA, which is clearly a fault. In TIA Portal, NORM_X turns the raw number into 0.0 to 1.0 and SCALE_X turns that into real units. Value = low + (mA − 4) ÷ 16 × (high − low).','Always scale before you compare or show a value.','Do not use 32767 as the top of the range. For analog cards the top is 27648.']]},
{id:'c9',t:'Safety: what can go wrong',ic:'⚠️',p:'c9',L:[
['A program can hurt people','Wrong logic is not just a bug. A missing stop can leave a machine running with a person inside. A missing gas check can let gas build up and explode. Two directions ON together can short the power and flash over. Every problem here shows what could really happen.','For every rung ask: what if this wire breaks? What if two things happen together?','Do not skip checks because "it never happens". It will, on the worst day.'],
['Your safety checklist','1) Stops and faults fail safe. 2) Dangerous outputs need permissions (air flow, flame, guards). 3) Opposite directions are interlocked. 4) A restart after a fault needs a new deliberate press. 5) A hardware emergency stop always cuts power by itself.']]}];
